name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.19"

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --warnings-as-errors

      - name: Check bundled scenarios
        run: mix aethrion.scenario --all --quiet

      # Each scenario in a fresh VM, so results cannot depend on which modules
      # an earlier scenario happened to load.
      - name: Check each scenario in isolation
        run: for f in priv/scenarios/*.json; do mix aethrion.scenario "$f" --quiet || exit 1; done

      - name: Scenario schema
        run: |
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet jsonschema
          /tmp/schema-venv/bin/python scripts/check_schema.py

      - name: Credo
        run: mix credo

      - name: Dialyzer
        run: MIX_ENV=dev mix dialyzer

      - name: Run examples
        run: |
          mix run examples/embed_runtime.exs
          mix run examples/custom_rule.exs
          mix run examples/supervised_world.exs
          mix run examples/tutorial_cafe.exs
          mix run examples/reputation.exs
          mix run examples/companion_week.exs
          mix run examples/chat_app.exs
          mix run examples/llm_render.exs  # falls back to the fake adapter without keys
